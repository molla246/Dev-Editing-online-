<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#242c26" />
      <stop offset="100%" stop-color="#141816" />
    </radialGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e575" />
      <stop offset="50%" stop-color="#00a84e" />
      <stop offset="100%" stop-color="#004721" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2c372f" stroke-width="6" />

  <!-- Shield Shape Glow -->
  <path d="M256 70 C340 70, 395 105, 395 180 C395 305, 290 395, 256 425 C222 395, 117 305, 117 180 C117 105, 172 70, 256 70 Z"
        fill="#18221b" stroke="url(#shieldBorder)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Key Logo -->
  <g transform="translate(146, 176) scale(4.6)">
    <!-- Blue Ring -->
    <circle cx="16" cy="24" r="8.5" stroke="#4285F4" stroke-width="4.2" fill="none" />
    <!-- Yellow Shaft -->
    <path d="M23 24 H40" stroke="#FBBC05" stroke-width="4.2" stroke-linecap="round" />
    <!-- Green Tooth -->
    <path d="M32 24 V31" stroke="#34A853" stroke-width="4.2" stroke-linecap="round" />
    <!-- Red Tooth -->
    <path d="M38 24 V29" stroke="#EA4335" stroke-width="4.2" stroke-linecap="round" />
  </g>
</svg>
